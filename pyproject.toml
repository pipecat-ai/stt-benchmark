[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stt-benchmark"
version = "0.1.0"
description = "STT (Speech-to-Text) TTFB benchmarking tool using Pipecat"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["stt", "speech-to-text", "benchmark", "ttfb", "pipecat", "latency"]
dependencies = [
    # Pipecat with STT providers
    "pipecat-ai[assemblyai,aws,azure,cartesia,deepgram,elevenlabs,fal,gladia,google,gradium,groq,mistral,nvidia,openai,sagemaker,sarvam,smallest,soniox,speechmatics,whisper,silero,soundfile,xai]>=1.8.0,<2",
    # Dataset handling
    "datasets>=2.16.0,<3.0.0",
    "scipy>=1.11.0",
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Storage
    "aiosqlite>=0.19.0",
    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",
    # Utilities
    "loguru>=0.7.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "librosa",
    # Semantic WER evaluation (Claude)
    "anthropic>=0.76.0",
    # Ground truth generation (Gemini); >=2.9.0 required by GeminiSTTService
    "google-genai>=2.9.0",
    # Interactive review (keyboard input)
    "readchar>=4.0.0",
    "adjusttext>=1.3.0",
]

[project.scripts]
stt-benchmark = "stt_benchmark.cli.main:app"

[project.optional-dependencies]
viz = [ "matplotlib>=3.8.0" ]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stt_benchmark"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-bugbear]
# Typer reads a CLI parameter's configuration from its default, so calling these
# in a default argument is the documented idiom rather than a shared-state bug.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
